services:
    app-prod:
        image: ghcr.io/lycoon/scenarly-app:latest
        container_name: scenarly-prod
        profiles: ["prod"]
        restart: unless-stopped
        env_file: .env.prod
        build: .
        environment:
            - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db-prod:5432/${DB_NAME}?schema=public
        depends_on:
            db-prod:
                condition: service_healthy
        networks:
            - webproxy
            - internal
        labels:
            - traefik.enable=true
            - traefik.docker.network=webproxy
            # Catch-all: the app owns everything the static landing does not claim
            # (/_next, /images, /fonts, /dictionaries, /tts, /api, /projects,
            # /admin, /auth, /desktop-oauth, /favicon.ico, ...). Lowest priority so
            # the landing wins for its paths.
            - traefik.http.routers.scenarly-app.rule=Host(`scenarly.com`)
            - traefik.http.routers.scenarly-app.entrypoints=secure
            - traefik.http.routers.scenarly-app.tls=true
            - traefik.http.routers.scenarly-app.tls.certresolver=letsencrypt
            - traefik.http.routers.scenarly-app.priority=1

    # Public homepage: standalone static site (/, /manifesto, /privacy, /terms, /contact, and
    # /robots.txt, which points crawlers at the app's Community sitemap) served by
    # nginx. No DB, no Node, no migrations. Deployed on its own cadence by the
    # deploy-landing workflow, so app releases and failures never affect it.
    landing-prod:
        image: ghcr.io/lycoon/scenarly-landing:latest
        container_name: scenarly-landing-prod
        profiles: ["prod"]
        restart: unless-stopped
        networks:
            - webproxy
        labels:
            - traefik.enable=true
            - traefik.docker.network=webproxy
            - traefik.http.routers.scenarly-landing.rule=Host(`scenarly.com`) && (Path(`/`) || Path(`/robots.txt`) || PathPrefix(`/manifesto`) || PathPrefix(`/privacy`) || PathPrefix(`/terms`) || PathPrefix(`/contact`) || PathPrefix(`/_site`))
            - traefik.http.routers.scenarly-landing.entrypoints=secure
            - traefik.http.routers.scenarly-landing.tls=true
            - traefik.http.routers.scenarly-landing.tls.certresolver=letsencrypt
            - traefik.http.routers.scenarly-landing.priority=100
            - traefik.http.services.scenarly-landing.loadbalancer.server.port=80

    app-staging:
        image: ghcr.io/lycoon/scenarly-app:staging
        container_name: scenarly-staging
        profiles: ["staging"]
        restart: unless-stopped
        env_file: .env.staging
        build: .
        environment:
            - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db-staging:5432/${DB_NAME}?schema=public
        depends_on:
            db-staging:
                condition: service_healthy
        networks:
            - webproxy
            - internal
        labels:
            - traefik.enable=true
            - traefik.docker.network=webproxy
            # Catch-all, mirrors the prod split. Staging is not gated here: the
            # app turns away accounts off ACCESS_ALLOWLIST (.env.staging), which
            # leaves webhooks, Worker callbacks and the desktop apps untouched.
            - traefik.http.routers.scenarly-staging.rule=Host(`staging.scenarly.com`)
            - traefik.http.routers.scenarly-staging.entrypoints=secure
            - traefik.http.routers.scenarly-staging.tls=true
            - traefik.http.routers.scenarly-staging.tls.certresolver=letsencrypt
            - traefik.http.routers.scenarly-staging.priority=1
            # Keep staging out of search results (the Showcase pages are public).
            - traefik.http.routers.scenarly-staging.middlewares=staging-noindex
            - traefik.http.middlewares.staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow

    # Staging homepage: standalone static site, mirrors landing-prod.
    landing-staging:
        image: ghcr.io/lycoon/scenarly-landing:staging
        container_name: scenarly-landing-staging
        profiles: ["staging"]
        restart: unless-stopped
        networks:
            - webproxy
        labels:
            - traefik.enable=true
            - traefik.docker.network=webproxy
            - traefik.http.routers.scenarly-landing-staging.rule=Host(`staging.scenarly.com`) && (Path(`/`) || Path(`/robots.txt`) || PathPrefix(`/manifesto`) || PathPrefix(`/privacy`) || PathPrefix(`/terms`) || PathPrefix(`/contact`) || PathPrefix(`/_site`))
            - traefik.http.routers.scenarly-landing-staging.entrypoints=secure
            - traefik.http.routers.scenarly-landing-staging.tls=true
            - traefik.http.routers.scenarly-landing-staging.tls.certresolver=letsencrypt
            - traefik.http.routers.scenarly-landing-staging.priority=100
            - traefik.http.routers.scenarly-landing-staging.middlewares=staging-noindex
            - traefik.http.services.scenarly-landing-staging.loadbalancer.server.port=80

    # Production Database
    db-prod:
        image: postgres:17-alpine
        profiles: ["prod"]
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - ./db_prod:/var/lib/postgresql/data
        networks:
            - internal
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5

    # Staging Database
    db-staging:
        image: postgres:17-alpine
        profiles: ["staging"]
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - ./db_staging:/var/lib/postgresql/data
        networks:
            - internal
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5

    # Testing Database
    db-dev:
        image: postgres:17-alpine
        profiles: ["dev"]
        restart: unless-stopped
        ports:
            - "5433:5432"
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - ./db_dev:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5

    prometheus:
        image: prom/prometheus:latest
        container_name: scenarly-prometheus
        profiles: ["prod"]
        restart: unless-stopped
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=30d
        volumes:
            - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        configs:
            - source: metrics_bearer_token
              target: /etc/prometheus/bearer-token
              mode: 0400
        networks:
            - internal
        depends_on:
            - app-prod
            - node-exporter

    # Host metrics (disk, CPU, memory) for Prometheus. Reads the host root
    # read-only via /host and shares the host PID namespace so it sees the
    # host's mount table rather than the container's.
    node-exporter:
        image: prom/node-exporter:latest
        container_name: scenarly-node-exporter
        profiles: ["prod"]
        restart: unless-stopped
        pid: host
        command:
            - --path.rootfs=/host
        volumes:
            - /:/host:ro,rslave
        networks:
            - internal

    grafana:
        image: grafana/grafana:latest
        container_name: scenarly-grafana
        profiles: ["prod"]
        restart: unless-stopped
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            - GF_SERVER_ROOT_URL=https://monitoring.scenarly.com
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_SMTP_ENABLED=true
            - GF_SMTP_HOST=${SMTP_HOST}:${SMTP_PORT:-465}
            - GF_SMTP_USER=${SMTP_USER}
            - GF_SMTP_PASSWORD=${SMTP_SECRET}
            - GF_SMTP_FROM_ADDRESS=no-reply@scenarly.com
            - GF_SMTP_FROM_NAME=Scenarly Monitoring
        volumes:
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        networks:
            - webproxy
            - internal
        depends_on:
            - prometheus
        labels:
            - traefik.enable=true
            - traefik.docker.network=webproxy
            - traefik.http.routers.scenarly-monitoring.rule=Host(`monitoring.scenarly.com`)
            - traefik.http.routers.scenarly-monitoring.entrypoints=secure
            - traefik.http.routers.scenarly-monitoring.tls=true
            - traefik.http.routers.scenarly-monitoring.tls.certresolver=letsencrypt
            - traefik.http.routers.scenarly-monitoring.middlewares=monitoring-auth
            - traefik.http.middlewares.monitoring-auth.basicauth.users=${MONITORING_AUTH_USERS}
            - traefik.http.services.scenarly-monitoring.loadbalancer.server.port=3000

configs:
    metrics_bearer_token:
        content: ${METRICS_BEARER_TOKEN}

volumes:
    prometheus_data:
    grafana_data:

networks:
    webproxy:
        external: true
    internal:
        external: false
