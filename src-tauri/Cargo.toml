[package]
name = "Scenarly"
version = "0.0.0"
description = "Screenwriting Software"
authors = ["Arko Logic"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2.8.0"
tauri-plugin-store = "2.4.2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
# Already in the tree via tauri; declared so the raw-body IPC below can decode
# the path header, which is percent-encoded to survive non-ASCII filenames.
percent-encoding = "2.3"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2.5.3"

# Desktop only: a second launch (double-clicking another `.scenarly`) must reach
# the running window rather than start a rival instance with its own copy of the
# project. Meaningless on mobile, where the OS runs one instance anyway.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Runtime fs-scope grants (what the save/open dialog hands out for the file the
# user picked) live only for the session. A file-backed project has to survive a
# restart, so they are persisted and restored on launch.
tauri-plugin-persisted-scope = "2"

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-iap = "0.9"

# Answering WebView2's permission request natively (see src/webview_permissions.rs).
# Both already in the tree through tauri/wry, at these versions.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

# Sign-in sheets that stay inside the app, which App Review requires on the
# Apple platforms (see src/apple_auth.rs). Everything but the
# AuthenticationServices bindings is already in the tree through tauri, at
# these versions.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSError",
    "NSString",
    "NSURL",
] }
objc2-authentication-services = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "ASFoundation",
    "ASAuthorization",
    "ASAuthorizationAppleIDCredential",
    "ASAuthorizationAppleIDProvider",
    "ASAuthorizationAppleIDRequest",
    "ASAuthorizationController",
    "ASAuthorizationCredential",
    "ASAuthorizationError",
    "ASAuthorizationOpenIDRequest",
    "ASAuthorizationProvider",
    "ASAuthorizationRequest",
    "ASWebAuthenticationSession",
] }
tokio = { version = "1", features = ["sync"] }
