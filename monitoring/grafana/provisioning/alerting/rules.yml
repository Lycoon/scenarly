apiVersion: 1

# Provisioned rules are never removed just because they leave this file; the
# pre-rename "scriptio-*" rules and the retired DB-ceiling rule have to be
# deleted explicitly.
deleteRules:
    - orgId: 1
      uid: scriptio-http-error-rate
    - orgId: 1
      uid: scriptio-db-almost-full
    - orgId: 1
      uid: scenarly-db-almost-full

groups:
    - orgId: 1
      name: scenarly-app
      folder: scenarly
      interval: 1m
      rules:
          - uid: scenarly-http-error-rate
            title: HighHttpErrorRate
            condition: C
            data:
                - refId: A
                  relativeTimeRange:
                      from: 600
                      to: 0
                  datasourceUid: prometheus
                  model:
                      refId: A
                      expr: sum(rate(http_requests_total{status=~"4..|5.."}[5m])) / sum(rate(http_requests_total[5m]))
                      instant: true
                - refId: C
                  relativeTimeRange:
                      from: 600
                      to: 0
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator:
                                type: gt
                                params: [0.05]
            for: 5m
            noDataState: OK
            execErrState: Error
            annotations:
                summary: HTTP error rate above 5%
                description: "{{ $values.A.Value | humanizePercentage }} of requests in the last 5 minutes returned a 4xx/5xx status."

          - uid: scenarly-disk-almost-full
            title: DiskAlmostFull
            condition: C
            data:
                - refId: A
                  relativeTimeRange:
                      from: 600
                      to: 0
                  datasourceUid: prometheus
                  model:
                      refId: A
                      # Used fraction of the host root filesystem, from node_exporter
                      expr: 1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
                      instant: true
                - refId: C
                  relativeTimeRange:
                      from: 600
                      to: 0
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator:
                                type: gt
                                params: [0.85]
            for: 10m
            noDataState: OK
            execErrState: Error
            annotations:
                summary: VPS disk is almost full
                description: "The root filesystem is at {{ $values.A.Value | humanizePercentage }} capacity."
